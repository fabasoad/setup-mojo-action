---
name: Setup Mojo
author: Yevhen Fabizhevskyi
description: This action sets up a MAX and Mojo.
branding:
  icon: terminal
  color: gray-dark
inputs:
  force:
    description: |
      If "true" it installs MAX and Mojo even if it is already installed on a
      runner. Otherwise, skips installation.
    default: "false"
    required: false
outputs:
  installed:
    description: Whether mojo was installed or not.
    value: "${{ steps.install-mojo.outcome == 'success' }}"
runs:
  using: "composite"
  steps:
    - name: Fail
      if: ${{ runner.os == 'Windows' }}
      run: |
        echo "::error::${RUNNER_OS} ${RUNNER_ARCH} is not supported"
        exit 1
      shell: sh

    - name: Validate inputs
      id: validate-inputs
      env:
        INPUT_FORCE: "${{ inputs.force }}"
      run: ./validate-inputs.sh "${INPUT_FORCE}"
      shell: sh
      working-directory: ${{ github.action_path }}/src

    - name: Collect info
      id: info
      env:
        INPUT_FORCE: "${{ inputs.force }}"
      run: ./collect-info.sh "${INPUT_FORCE}"
      shell: sh
      working-directory: "${{ github.action_path }}/src"

    - name: Install Mojo
      if: ${{ steps.info.outputs.bin-installed == 'false' }}
      id: install-mojo
      run: ./install-mojo.sh
      shell: bash
      working-directory: "${{ github.action_path }}/src"

    - name: Print version
      run: |
        magic --version
        mojo --version
        max --version
      shell: sh
